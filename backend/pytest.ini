[pytest]
# Task 8.1 / 9.1：分层测试自动发现
testpaths =
    ../tests
    security/tests
    observability/logging/tests
    app/agents/tests
    app/llm/tests
    app/config/tests
    app/prompts/tests
pythonpath = . ..
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers

norecursedirs =
    .venv
    .venv-api
    .venv-vllm
    project_runs
    tmp-tester-demo
    workspace
    node_modules
    __pycache__

markers =
    unit: 快速单元测试（默认 tests/unit）
    integration: 需要 torch/transformers 或外部依赖
    e2e: 端到端 API / 多模块流程（tests/e2e）
    slow: 长时间 benchmark，默认 CI 排除

filterwarnings =
    ignore::DeprecationWarning
