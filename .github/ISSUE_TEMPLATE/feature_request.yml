name: 功能建议
description: 提出新功能、增强或架构改进
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎功能建议。请说明 **背景** 与 **使用场景**，便于维护者评估范围。

  - type: textarea
    id: problem
    attributes:
      label: 背景 / 痛点
      description: 当前缺少什么能力？解决谁的什么问题？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你期望的行为或 API 设计（可含伪代码）
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: 建议归属模块
      options:
        - core/agent
        - knowledge/rag
        - llm/providers · gateway · router
        - workflow
        - applications / Demo
        - infra / 部署
        - 文档 / 开源规范
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: alternatives
    attributes:
      label: 其他
      options:
        - label: 我愿意提交 PR 实现（见 CONTRIBUTING.md）
        - label: 该功能可先做 Mock Demo 验证

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 参考项目、设计草图、性能/安全约束等
