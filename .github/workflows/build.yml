name: Build

on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main, master, develop]

concurrency:
  group: build-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Build API image (infra/docker/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          load: true
          tags: enterprise-ai-agent/api:ci
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha

      - name: Build production image (infra/deploy/Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/deploy/Dockerfile
          push: false
          load: true
          tags: enterprise-ai-agent/deploy:ci
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha

      - name: Verify API image health endpoint
        run: |
          docker image inspect enterprise-ai-agent/api:ci >/dev/null
          docker run -d --name ci-api -p 18001:8001 enterprise-ai-agent/api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18001/health; then
              echo "Health OK"
              docker stop ci-api
              exit 0
            fi
            sleep 2
          done
          docker logs ci-api || true
          docker stop ci-api || true
          exit 1
