name: Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements-dev.txt

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: bash scripts/run_lint.sh

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-knowledge.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-knowledge.txt
          pip install "redis>=5.0.0"

      - name: Run tests
        run: bash scripts/run_tests.sh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit
          path: backend/artifacts/test-report.xml
          if-no-files-found: ignore

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -q

      - name: Export OpenAPI
        run: python scripts/export_openapi.py

      - name: Verify VERSION matches OpenAPI
        run: |
          python -c "
          import json, pathlib
          v = pathlib.Path('../VERSION').read_text().strip()
          o = json.loads(pathlib.Path('../docs/openapi.json').read_text())['info']['version']
          assert v == o, f'{v} != {o}'
          "

      - name: Validate Docker Compose files
        run: |
          docker compose -f ../infra/deploy/docker-compose.yml config --quiet
          docker compose -f ../deploy/docker-compose.yml config --quiet
          docker compose -f ../infra/docker/docker-compose.yml config --quiet
          docker compose -f ../infra/docker/docker-compose.api-only.yml config --quiet
          docker compose -f ../docker/docker-compose.yml config --quiet
          docker compose -f ../docker/docker-compose.api-only.yml config --quiet

      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-json
          path: docs/openapi.json
