# Task 4.7 — reverse proxy to Platform API
# Mounted as /etc/nginx/conf.d/default.conf

upstream enterprise_api {
    server api:8001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 64m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /health {
        proxy_pass http://enterprise_api/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
        proxy_pass http://enterprise_api/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 生产环境建议在前置网关或此处收紧 ACL
    }

    location / {
        proxy_pass http://enterprise_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
