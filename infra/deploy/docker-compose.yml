# Task 4.7 生产栈 — nginx + API + Agent Worker + vLLM + Chroma + Redis
#
# 在仓库根目录执行：
#   docker compose -f infra/deploy/docker-compose.yml up --build
#
# 兼容旧路径：
#   docker compose -f deploy/docker-compose.yml up --build
#
# 需要：NVIDIA GPU + Container Toolkit（vLLM 服务）

name: enterprise-ai-prod

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: enterprise-ai-nginx
    ports:
      - "${NGINX_HOST_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile
    container_name: enterprise-ai-api
    environment: &app_env
      APP_NAME: ${APP_NAME:-Enterprise AI Agent}
      DEBUG: ${DEBUG:-false}
      HOST: 0.0.0.0
      PORT: "8001"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-vllm}
      MODEL_NAME: ${MODEL_NAME:-Qwen/Qwen2.5-0.5B-Instruct}
      VLLM_ENDPOINT: http://vllm:8000/v1
      VLLM_API_KEY: ${VLLM_API_KEY:-EMPTY}
      VLLM_MAX_TOKENS: ${VLLM_MAX_TOKENS:-256}
      TEMPERATURE: ${TEMPERATURE:-0.7}
      MAX_TOKENS: ${MAX_TOKENS:-4096}
      MAX_AGENT_LOOP: ${MAX_AGENT_LOOP:-5}
      VECTOR_STORE_PROVIDER: chroma
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-enterprise_kb}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      ENABLE_KNOWLEDGE_TOOL: ${ENABLE_KNOWLEDGE_TOOL:-true}
      REDIS_URL: redis://redis:6379/0
      ENABLE_INFRA_METRICS: ${ENABLE_INFRA_METRICS:-true}
      ENABLE_STRUCTURED_LOGGING: ${ENABLE_STRUCTURED_LOGGING:-true}
      ENABLE_AGENT_TRACE: ${ENABLE_AGENT_TRACE:-false}
      KNOWLEDGE_UPLOAD_DIR: /app/data/knowledge_uploads
      TRACE_EXPORT_DIR: /app/data/agent_traces
    volumes:
      - api-data:/app/data
    depends_on:
      vllm:
        condition: service_healthy
      chroma:
        condition: service_started
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  agent:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile
    container_name: enterprise-ai-agent-worker
    command: ["python", "-m", "app.worker.entry"]
    environment:
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  vllm:
    image: vllm/vllm-openai:v0.10.2
    container_name: enterprise-ai-vllm
    ipc: host
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      VLLM_USE_FLASHINFER_SAMPLER: ${VLLM_USE_FLASHINFER_SAMPLER:-0}
    gpus: all
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-0.5B-Instruct}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-Qwen/Qwen2.5-0.5B-Instruct}
      - --max-model-len
      - "${VLLM_MAX_LEN:-512}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_UTIL:-0.70}"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-16}"
      - --max-num-batched-tokens
      - "${VLLM_MAX_BATCHED_TOKENS:-2048}"
      - --swap-space
      - "2"
      - --enforce-eager
      - --dtype
      - auto
      - --trust-remote-code
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 600s
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:0.5.23
    container_name: enterprise-ai-chroma
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
      ALLOW_RESET: "FALSE"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: enterprise-ai-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  hf-cache:
  chroma-data:
  redis-data:
  api-data:
